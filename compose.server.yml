# Distributed setup, part 1: the server only (app, API, database, push). It runs no agents and holds no
# Claude login. Put it behind HTTPS (see README → "Distributed setup"), then add workers from
# Settings → Workers and run compose.worker.yml (or the worker without Docker) on each machine.
#   docker compose -f compose.server.yml up -d --build
services:
  server:
    build: { context: ., dockerfile: docker/Dockerfile.server }
    ports: ["${PORT:-3000}:3000"]
    # server.env (docker/server.env.example): PUBLIC_URL must be the https address you open the app on
    env_file: [server.env]
    environment:
      DATA_DIR: /data
    volumes: [dispatch-data:/data]
    restart: unless-stopped

  # nightly copy of the database and attachments (14 days kept)
  backup:
    build: { context: ., dockerfile: docker/Dockerfile.server }
    command: ["node", "src/server/backup.ts", "--data", "/data", "--out", "/backups", "--at", "03:15", "--keep", "14"]
    # root, so it can write into the host folder ./backups (the app image runs as the node user).
    # To own the files yourself instead: BACKUP_USER=$(id -u):$(id -g) and make ./backups writable for it.
    user: "${BACKUP_USER:-0:0}"
    environment: { TZ: "${TZ:-UTC}" }
    volumes: [dispatch-data:/data, "${BACKUP_DIR:-./backups}:/backups"]
    restart: unless-stopped

volumes:
  dispatch-data:
