<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom locked: the shell is a fixed-height layout; a zoomed locked layout strands you off-screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- matches the header surface; no black-translucent status bar (iOS blurs content scrolled under it) -->
    <meta name="theme-color" content="#19191c" />
    <meta name="apple-mobile-web-app-title" content="Dispatch" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Dispatch</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Watchdog: if the app has not started after 8 s (e.g. iOS kept an old build's files),
         offer a reload, or a reset that drops the service worker and its caches. -->
    <div id="boot-fail" hidden style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#111113;color:#ededef;font:15px -apple-system,system-ui,sans-serif;padding:24px;text-align:center">
      <div>Dispatch did not start.</div>
      <button onclick="location.reload()" style="font:inherit;padding:10px 18px;border-radius:10px;border:1px solid #2c2c31;background:#222226;color:inherit">Reload</button>
      <button id="boot-reset" style="font:inherit;padding:10px 18px;border-radius:10px;border:0;background:#6e6ff0;color:#fff">Reset app</button>
    </div>
    <script>
      setTimeout(function () {
        if (window.__dispatchStarted) return;
        var el = document.getElementById('boot-fail');
        el.hidden = false;
        document.getElementById('boot-reset').onclick = async function () {
          try {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          } catch (e) {}
          location.replace('/?reset=' + Date.now());
        };
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
