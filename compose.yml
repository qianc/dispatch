# One machine: the server (app, API, database) and one worker (runs Claude) side by side.
#   cp docker/server.env.example server.env    # WORKER_TOKEN, APP_PASSWORD, (GITHUB_TOKEN)
#   cp docker/worker.env.example worker.env    # the same WORKER_TOKEN, CLAUDE_CODE_OAUTH_TOKEN, (GITHUB_TOKEN)
#   docker compose up -d --build
#   open http://localhost:3000
# More workers on other machines: see compose.worker.yml and README → "Distributed setup".
services:
  server:
    build: { context: ., dockerfile: docker/Dockerfile.server }
    ports: ["${PORT:-3000}:3000"]
    env_file: [server.env]
    environment:
      DATA_DIR: /data
      # schedules run at local times in this zone
      TZ: "${TZ:-UTC}"
    volumes: [dispatch-data:/data]
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: docker/Dockerfile.worker }
    depends_on: [server]
    # worker.env: its token, the Claude login, GitHub (docker/worker.env.example)
    env_file: [worker.env]
    environment:
      SERVER_WS_URL: ws://server:3000/worker
      ASSISTANT_READ_DIRS: /host/notes
    volumes:
      - workspaces:/workspaces
      - claude-home:/home/node/.claude
      # a folder the Assistant may read (retros, notes); read-only
      - ${NOTES_DIR:-./docs}:/host/notes:ro
      # local repos (no GitHub): mount them and set LOCAL_REPO_DIRS=/host/repos
      # - ${HOME}/repos:/host/repos
    restart: unless-stopped

volumes:
  dispatch-data:
  workspaces:
  claude-home:
